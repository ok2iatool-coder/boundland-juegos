<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Boundland · El Linde</title>
<style>
  html, body { margin: 0; background: #0b0a0c; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="8400" height="1600"></canvas>
<script type="module">
// EL LINDE, segunda pasada del concepto con la imagen de referencia del usuario: bosque a contraluz dorado,
// chatarra oxidada comida por el musgo (autobus, pasarela), cascadas, setas que brillan, una aldea colgada de
// un arbol gigante con capsulas encendidas, afueras industriales y las agujas de la ciudad en la bruma.
// Se pinta por CAPAS de profundidad (cielo, lejos, medio lejos, medio, juego, primer plano): cada capa se
// pinta en un lienzo aparte y se compone con su desenfoque, y entre capa y capa entra la bruma y los rayos.
// Al final, reflejo en el agua, resplandor, etalonaje, vineta y grano. ?rotulos pone los nombres encima.
// Las PIEZAS viven en modulos (web/linde/): troncos, suelo, follaje, metal y casas, sobre lo compartido de
// base.js, y la COMPOSICION en linde/escena.js. El nivel 6 del juego (El Linde) usa las mismas piezas
// (linde/obrero.js). Aqui se quedan el 18, el etalonaje y los rotulos.
// ?banco=<troncos|suelo|follaje|metal|casas> pinta solo el banco de ese modulo (?banco a secas = troncos).
import { TINTA, azar } from './dibujo/tinta.js';
import { W, H, g, ponerG, sueloY, brillo } from './linde/base.js';
import { PLANO_CONCEPTO } from './linde/geometria.js';
import { cielo, pintarEscena, encenderLuces } from './linde/escena.js';
import { banco as bancoTroncos } from './linde/troncos.js';
import { banco as bancoSuelo } from './linde/suelo.js';
import { banco as bancoFollaje } from './linde/follaje.js';
import { banco as bancoMetal } from './linde/metal.js';
import { banco as bancoCasas } from './linde/casas.js';

const QS = new URLSearchParams(location.search);
const ROT = QS.has('rotulos');
const BANCO = QS.has('banco') ? (QS.get('banco') || 'troncos') : null;
const BANCOS = { troncos: bancoTroncos, suelo: bancoSuelo, follaje: bancoFollaje, metal: bancoMetal, casas: bancoCasas };
if (BANCO && !BANCOS[BANCO]) throw new Error(`?banco=${BANCO} no existe: ${Object.keys(BANCOS).join(', ')}`);
window.__troncos = [];
const hoja18 = await (await fetch('img/sujeto/sujeto.json')).json();
const im18 = new Image(); im18.src = 'img/sujeto/andar.webp'; await im18.decode();

const main = document.getElementById('c'), M = main.getContext('2d');
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
const T = tmp.getContext('2d');
ponerG(T);

// la composicion por capas (linde/escena.js): aqui todas van al mismo lienzo
function capa(blur, fn) {
  T.clearRect(0, 0, W, H); ponerG(T); fn();
  M.save(); if (blur) M.filter = `blur(${blur}px)`; M.drawImage(tmp, 0, 0); M.restore();
}
const S = { ctx: () => M, capa: (destino, blur, fn) => capa(blur, fn), copiar: (C, x, y, w, h) => C.drawImage(main, x, y, w, h, 0, 0, w, h) };
// el 18 a la salida del conducto, con su luz (en el juego esta el de verdad)
function dieciocho() {
  const a = hoja18.anims.andar, [fw, fh] = a.fotograma, [px, py] = a.pies, k = 0.52, x = 330, pie = sueloY(330) + 2, fot = 3;
  g.save(); g.globalCompositeOperation = 'lighter'; brillo(x, pie - 90, 120, '#fff1dc', 0.18); g.restore();
  g.drawImage(im18, (fot % a.cols) * fw, Math.floor(fot / a.cols) * fh, fw, fh, x - px * k, pie - py * k, fw * k, fh * k);
}

cielo(M, PLANO_CONCEPTO);
if (BANCO) { capa(0, BANCOS[BANCO]); encenderLuces(M); }
else pintarEscena(S, { ...PLANO_CONCEPTO, dieciocho });

// ================================================================= 9. RESPLANDOR, etalonaje, vineta y grano
T.clearRect(0, 0, W, H); T.filter = 'blur(26px)'; T.drawImage(main, 0, 0); T.filter = 'none';
M.save(); M.globalCompositeOperation = 'screen'; M.globalAlpha = 0.2; M.drawImage(tmp, 0, 0); M.restore();
M.save(); M.globalCompositeOperation = 'soft-light';
{ const gr = M.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, 'rgba(70,90,50,.5)'); gr.addColorStop(0.55, 'rgba(255,214,140,.45)'); gr.addColorStop(1, 'rgba(170,170,160,.35)'); M.fillStyle = gr; M.fillRect(0, 0, W, H); }
M.restore();
{ const gr = M.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, 'rgba(10,10,6,.35)'); gr.addColorStop(0.2, 'rgba(10,10,6,0)'); gr.addColorStop(0.78, 'rgba(10,10,6,0)'); gr.addColorStop(1, 'rgba(10,10,6,.6)'); M.fillStyle = gr; M.fillRect(0, 0, W, H); }
{ const gr = M.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, 'rgba(10,10,6,.45)'); gr.addColorStop(0.06, 'rgba(10,10,6,0)'); gr.addColorStop(0.95, 'rgba(10,10,6,0)'); gr.addColorStop(1, 'rgba(10,10,6,.35)'); M.fillStyle = gr; M.fillRect(0, 0, W, H); }
{ const gc = document.createElement('canvas'); gc.width = gc.height = 256; const G = gc.getContext('2d'), id = G.createImageData(256, 256), rr = azar(5);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (rr() - 0.5) * 90; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  G.putImageData(id, 0, 0); M.save(); M.globalCompositeOperation = 'overlay'; M.globalAlpha = 0.09; M.fillStyle = M.createPattern(gc, 'repeat'); M.fillRect(0, 0, W, H); M.restore(); }

// ================================================================= 10. ROTULOS (?rotulos)
if (ROT) {
  const ESC = [[0, 760, 'El conducto'], [760, 2400, 'El bosque profundo'], [2400, 3240, 'El arroyo'], [3240, 4000, 'La cabaña del leñador'], [4000, 5100, 'Los huertos'], [5100, 6300, 'La aldea'], [6300, 7300, 'Las afueras'], [7300, 8400, 'Boundland']];
  M.textAlign = 'center';
  ESC.forEach(([a, b, n], k) => {
    const cx = (a + b) / 2; M.font = '30px Georgia'; const w = M.measureText(n.toUpperCase()).width + 70;
    M.fillStyle = 'rgba(11,10,12,.66)'; M.fillRect(cx - w / 2, 214, w, 52); M.strokeStyle = 'rgba(240,232,214,.45)'; M.lineWidth = 1; M.strokeRect(cx - w / 2, 214, w, 52);
    M.fillStyle = '#f0e8d6'; M.fillText(`${k + 1} · ${n.toUpperCase()}`, cx, 251);
  });
  const nota = (x, y, t, s, hx, hy) => { M.textAlign = 'left'; M.font = 'bold 25px Georgia'; const w1 = M.measureText(t).width; M.font = '19px Georgia'; const w = Math.max(w1, M.measureText(s).width) + 34; M.strokeStyle = 'rgba(240,232,214,.8)'; M.lineWidth = 2; M.beginPath(); M.moveTo(x + 12, y + 70); M.lineTo(hx, hy); M.stroke(); M.fillStyle = 'rgba(240,232,214,.95)'; M.beginPath(); M.arc(hx, hy, 6, 0, 7); M.fill(); M.fillStyle = 'rgba(11,10,12,.74)'; M.fillRect(x, y, w, 72); M.fillStyle = '#f0e8d6'; M.font = 'bold 25px Georgia'; M.fillText(t, x + 17, y + 31); M.fillStyle = 'rgba(240,232,214,.82)'; M.font = '19px Georgia'; M.fillText(s, x + 17, y + 58); };
  nota(1560, 640, 'Juego 1 · Los anillos del árbol', 'Girar los anillos hasta casar las marcas: la raíz se aparta', 1760, sueloY(1760) - 80);
  nota(4720, 560, 'Juego 2 · Las campanillas', 'El viento toca una melodía en el porche: repetirla', 5000, sueloY(5000) - 130);
  nota(7420, 640, 'Juego 3 · El cuadro de luz', 'Girar las piezas del circuito para subir la persiana', 7970, 840);
  nota(120, 760, 'Sale del laboratorio', 'Por el conducto, a la ladera', 330, sueloY(330) - 80);
  nota(2480, 900, 'La pasarela', 'Hierro viejo sobre el arroyo', 2700, 1120);
  nota(5420, 900, 'Subir a la cápsula', 'Escalera y plataforma en el árbol', 5600, 800);
  nota(6440, 900, 'El autobús', 'Se cruza por el techo', 6700, sueloY(6700) - 170);
  M.fillStyle = 'rgba(11,10,12,.8)'; M.fillRect(40, 40, 1540, 130); M.strokeStyle = 'rgba(240,232,214,.5)'; M.strokeRect(40, 40, 1540, 130);
  M.textAlign = 'left'; M.fillStyle = '#f0e8d6'; M.font = '48px Georgia'; M.fillText('Nivel 6 · El Linde   —   concepto', 70, 100);
  M.fillStyle = 'rgba(240,232,214,.78)'; M.font = '22px Georgia'; M.fillText('Del conducto del laboratorio a la ciudad: bosque, arroyo, cabaña, huertos, la aldea, las afueras y Boundland.', 70, 144);
}
document.title = 'listo';
</script>
</body>
</html>
