<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boundland · Assets</title>
<style>
  :root { --fondo: #0d1117; --tarjeta: #151b23; --linea: #2a323d; --texto: #e9e2d4; --suave: #8b93a0; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 14px Georgia, serif; }
  header { padding: 28px 24px 8px; display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; }
  h1 { margin: 0; font-weight: normal; letter-spacing: .3em; font-size: 26px; }
  header p { margin: 0; color: var(--suave); }
  .controles { margin-left: auto; display: flex; gap: 8px; }
  button { background: transparent; color: var(--texto); border: 1px solid var(--linea); padding: 6px 12px; font: inherit; cursor: pointer; }
  button.activo { border-color: var(--texto); }
  h2 { font-weight: normal; letter-spacing: .2em; font-size: 15px; color: var(--suave); padding: 18px 24px 0; margin: 0; text-transform: uppercase; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 12px 24px 8px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--linea); display: flex; flex-direction: column; }
  .lienzo { height: 220px; display: flex; align-items: center; justify-content: center; padding: 10px; }
  .lienzo canvas { max-width: 100%; max-height: 200px; }
  body.claro .lienzo { background: #b9b4a8; }
  body.cuadros .lienzo { background: repeating-conic-gradient(#20262e 0 25%, #171c23 0 50%) 0 0 / 16px 16px; }
  .pie { border-top: 1px solid var(--linea); padding: 8px 10px; }
  .pie b { font-weight: normal; display: block; }
  .pie span { color: var(--suave); font-size: 12px; }
  @media (max-width: 520px) { header, .rejilla, h2 { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body class="cuadros">
<header>
  <h1>BOUNDLAND</h1>
  <p>50 assets de los primeros mapas · laboratorio en ruinas · dibujados por código</p>
  <div class="controles">
    <button data-f="cuadros" class="activo">Transparente</button>
    <button data-f="oscuro">Oscuro</button>
    <button data-f="claro">Claro</button>
  </div>
</header>
<main id="todo"></main>
<script type="module">
  import { ASSETS, GRUPOS, lienzoDe } from './assets/catalogo.js';
  const todo = document.getElementById('todo');
  const k = 3 * Math.min(2, devicePixelRatio || 1);
  let n = 0;
  for (const [g, titulo] of Object.entries(GRUPOS)) {
    const lista = ASSETS.filter((a) => a.grupo === g);
    if (!lista.length) continue;
    const h = document.createElement('h2'); h.textContent = `${titulo} · ${lista.length}`; todo.append(h);
    const r = document.createElement('div'); r.className = 'rejilla'; todo.append(r);
    for (const a of lista) {
      n++;
      const t = document.createElement('div'); t.className = 'tarjeta';
      const l = document.createElement('div'); l.className = 'lienzo';
      const cv = lienzoDe(a, k);
      cv.style.width = cv.width / k * 1.4 + 'px';
      l.append(cv);
      const p = document.createElement('div'); p.className = 'pie';
      p.innerHTML = `<b>${String(n).padStart(2, '0')} · ${a.es}</b><span>${a.en} · ${(a.w / 32).toFixed(1)} × ${(a.h / 32).toFixed(1)} casillas · ${a.ancla}</span>`;
      t.append(l, p); r.append(t);
    }
  }
  for (const b of document.querySelectorAll('button')) b.onclick = () => {
    document.body.className = b.dataset.f;
    for (const o of document.querySelectorAll('button')) o.classList.toggle('activo', o === b);
  };
  // para tools/exportar_assets.mjs
  const orden = Object.keys(GRUPOS).flatMap((g) => ASSETS.filter((a) => a.grupo === g));
  window.exportar = (escala = 4) => orden.map((a, i) => ({ n: i + 1, id: a.id, es: a.es, en: a.en, grupo: a.grupo, w: a.w, h: a.h, ancla: a.ancla, png: lienzoDe(a, escala).toDataURL('image/png') }));
</script>
</body>
</html>
