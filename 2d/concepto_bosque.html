<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Boundland · concepto del linde</title>
<style>
  html, body { margin: 0; background: #0b0a0c; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="8400" height="1560"></canvas>
<script type="module">
// MAPA DE CONCEPTO del nivel nuevo (al salir del laboratorio): un solo nivel que va cambiando poco a poco en
// ocho escenarios, del conducto en la ladera al bosque profundo, el arroyo, la cabana del lenador, los
// huertos, la aldea, las afueras y la entrada a la ciudad. Tres juegos de pensar. Pintado por codigo con la
// tinta del juego y el 18 de verdad (su hoja de sprites). Abajo, el esquema del recorrido.
import { TINTA, azar, mezclar, rgba, temblar, trazar, trazarSuave, tinta, hash } from './dibujo/tinta.js';

// el 18 se carga ANTES de pintar: con todo el lienzo pintado, Chrome sin ventana hacia la foto antes de que llegase
const hoja = await (await fetch('img/sujeto/sujeto.json')).json();
const im = new Image(); im.src = 'img/sujeto/andar.webp'; await im.decode();
const cv = document.getElementById('c'), c = cv.getContext('2d');
const W = cv.width, HA = 1340, H = cv.height;           // HA: alto de la pintura; debajo, el esquema
const r = azar(518);
const lerp = (a, b, t) => a + (b - a) * t;
const suave = (t) => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };

// ---------------------------------------------------------------- los ocho escenarios
const ESC = [
  { x0: 0, x1: 760, n: 'El conducto', d: 'Sale del laboratorio a una ladera de raíces', cielo: ['#93ad9e', '#5c7766'] },
  { x0: 760, x1: 2400, n: 'El bosque profundo', d: 'Árboles enormes, musgo y rayos de sol', cielo: ['#a9c2b1', '#5f7d69'] },
  { x0: 2400, x1: 3200, n: 'El arroyo', d: 'Piedras y un tronco para cruzar', cielo: ['#b8cdbf', '#6f8c79'] },
  { x0: 3200, x1: 4000, n: 'La cabaña del leñador', d: 'La primera casa, sola en un claro', cielo: ['#cfd0b4', '#8c9070'] },
  { x0: 4000, x1: 5100, n: 'Los huertos', d: 'Vallas, invernadero roto, pozo y la granja', cielo: ['#dcd5b6', '#a49a78'] },
  { x0: 5100, x1: 6250, n: 'La aldea', d: 'Casitas juntas, molino y campanario', cielo: ['#ddd5bd', '#a39c84'] },
  { x0: 6250, x1: 7300, n: 'Las afueras', d: 'Casas en hilera, postes y coches con hiedra', cielo: ['#d3d2c6', '#9c9b93'] },
  { x0: 7300, x1: 8400, n: 'Boundland', d: 'La primera calle de la ciudad muerta', cielo: ['#cdd1cd', '#8f9391'] },
];
const escDe = (x) => ESC.findIndex((e) => x < e.x1) === -1 ? ESC.length - 1 : ESC.findIndex((e) => x < e.x1);
// mezcla suave entre el escenario de x y el siguiente (fundido de 220 px en cada frontera)
function porEsc(x, f) {
  const i = escDe(x), e = ESC[i];
  const k = suave((x - (e.x1 - 220)) / 440);
  const a = f(ESC[i]), b = f(ESC[Math.min(ESC.length - 1, i + 1)]);
  const k0 = suave((x - (e.x0 - 220)) / 440);
  const p = f(ESC[Math.max(0, i - 1)]);
  if (k0 < 1 && i > 0) return mezclar(p, a, k0);
  return k > 0 ? mezclar(a, b, k) : a;
}
// cuanto bosque, cuanto pueblo y cuanta ciudad hay en x (para los fondos)
const mezclaZona = (x) => ({ bosque: 1 - suave((x - 3000) / 1200), pueblo: suave((x - 3000) / 900) * (1 - suave((x - 6100) / 900)), ciudad: suave((x - 6000) / 1100) });

// ---------------------------------------------------------------- el terreno
const AGUA = 1176;
function sueloY(x) {
  let y = 1080;
  if (x < 760) y = lerp(990, 1080, suave(x / 760));
  y += Math.sin(x * 0.005) * 12 * mezclaZona(x).bosque + Math.sin(x * 0.0021 + 1) * 10 * mezclaZona(x).pueblo;
  // la vaguada del arroyo
  if (x > 2420 && x < 3080) y += 150 * suave((x - 2420) / 120) * (1 - suave((x - 2960) / 120));
  if (x > 7000) y = lerp(y, 1080, suave((x - 7000) / 300));
  return y;
}

// ---------------------------------------------------------------- cielo, luz y fondos
for (let x = 0; x < W; x += 4) {
  const g = c.createLinearGradient(0, 0, 0, HA);
  g.addColorStop(0, porEsc(x, (e) => e.cielo[0]));
  g.addColorStop(0.62, porEsc(x, (e) => e.cielo[1]));
  g.addColorStop(1, porEsc(x, (e) => mezclar(e.cielo[1], '#141612', 0.7)));
  c.fillStyle = g; c.fillRect(x, 0, 5, HA);
}
function brillo(x, y, rad, col, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, rad);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.fillRect(x - rad, y - rad, rad * 2, rad * 2);
}
c.save(); c.globalCompositeOperation = 'lighter';
brillo(1100, 60, 1000, '#ffe6b0', 0.24); brillo(3600, 120, 900, '#fff0c8', 0.22); brillo(5600, 100, 1000, '#ffeccc', 0.18);
c.restore();

function pinoLejano(x, base, alto, col) {
  c.fillStyle = col; c.beginPath(); c.moveTo(x, base - alto);
  for (let k = 0; k <= 6; k++) { const y = base - alto + (alto * k) / 6, w = alto * 0.18 * (k / 6 + 0.1); c.lineTo(x + w, y); c.lineTo(x + w * 0.55, y + alto * 0.04); }
  c.lineTo(x, base);
  for (let k = 6; k >= 0; k--) { const y = base - alto + (alto * k) / 6, w = alto * 0.18 * (k / 6 + 0.1); c.lineTo(x - w * 0.55, y + alto * 0.04); c.lineTo(x - w, y); }
  c.closePath(); c.fill();
}
function colina(x0, x1, base, alto, col) {
  c.fillStyle = col; c.beginPath(); c.moveTo(x0, base);
  for (let x = x0; x <= x1; x += 20) c.lineTo(x, base - alto * Math.sin(((x - x0) / (x1 - x0)) * Math.PI) * (0.85 + 0.15 * Math.sin(x * 0.01)));
  c.lineTo(x1, base); c.fill();
}
function capaFondo(base, escala, cols, semilla) {
  const rr = azar(semilla);
  let x = -60;
  while (x < W + 60) {
    const z = mezclaZona(x), col = mezclar(mezclar(cols[0], cols[1], z.pueblo / (z.bosque + z.pueblo + 0.001)), cols[2], z.ciudad);
    const q = rr() * (z.bosque + z.pueblo + z.ciudad);
    if (q < z.bosque) { pinoLejano(x, base, (170 + rr() * 260) * escala, col); x += (22 + rr() * 40) * escala; }
    else if (q < z.bosque + z.pueblo) {
      const w = (50 + rr() * 60) * escala, h = (30 + rr() * 30) * escala;
      if (rr() < 0.3) { colina(x - 80, x + 260 * escala, base, (40 + rr() * 50) * escala, col); }
      c.fillStyle = col; c.fillRect(x, base - h, w, h);
      c.beginPath(); c.moveTo(x - 6, base - h); c.lineTo(x + w / 2, base - h - w * 0.45); c.lineTo(x + w + 6, base - h); c.fill();
      if (rr() < 0.5) pinoLejano(x + w + 20, base, (100 + rr() * 120) * escala, col);
      x += w + (24 + rr() * 60) * escala;
    } else {
      const w = (60 + rr() * 100) * escala, h = (160 + rr() * 360) * escala;
      c.fillStyle = col; c.beginPath(); c.moveTo(x, base); c.lineTo(x, base - h);
      for (let k = 1; k <= 4; k++) c.lineTo(x + (w * k) / 4, base - h + (rr() - 0.3) * h * 0.1);
      c.lineTo(x + w, base); c.fill();
      c.fillStyle = mezclar(col, '#000000', 0.18);
      for (let yy = base - h + 18; yy < base - 10; yy += 18) for (let xx = x + 6; xx < x + w - 8; xx += 12) if (rr() < 0.45) c.fillRect(xx, yy, 5, 8);
      x += w * (0.7 + rr() * 0.6);
    }
  }
}
function niebla(y0, y1, a) {
  for (let x = 0; x < W; x += 6) {
    const col = porEsc(x, (e) => mezclar(e.cielo[0], '#ffffff', 0.25));
    const g = c.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, rgba(col, 0)); g.addColorStop(0.6, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g; c.fillRect(x, y0, 7, y1 - y0);
  }
}
capaFondo(880, 1, ['#8aa695', '#bdb79c', '#b2b5b1'], 11);
niebla(600, 930, 0.55);
capaFondo(960, 1.35, ['#5f7c68', '#968f78', '#8a8e8c'], 12);
niebla(760, 1000, 0.42);

// rayos de sol en el bosque y en el claro
c.save(); c.globalCompositeOperation = 'lighter';
for (const [x0, x1, n] of [[700, 2300, 14], [3250, 3900, 5]]) for (let k = 0; k < n; k++) {
  const x = x0 + (k / n) * (x1 - x0) + r() * 60, w = 30 + r() * 80;
  const g = c.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, 'rgba(255,236,190,.2)'); g.addColorStop(1, 'rgba(255,236,190,0)');
  c.fillStyle = g; c.beginPath(); c.moveTo(x, 0); c.lineTo(x + w, 0); c.lineTo(x + w + 280, 1080); c.lineTo(x + 200, 1080); c.fill();
}
c.restore();

// ---------------------------------------------------------------- piezas a tinta (las del primer borrador, mas las nuevas)
// MUSGO por capas: sombra debajo, cojines redondos uno junto a otro, luz arriba, hojitas en estrella,
// esporofitos (los pelillos con capsula) y, si cuelga de un borde, flequillo
function musgo(x, y, w, h, col, semilla, o = {}) {
  const rr = azar(semilla), osc = mezclar(col, '#141c10', 0.5), cla = mezclar(col, '#e6efb4', 0.38);
  const coj = []; let px = x;
  while (px < x + w) { const rad = h * (0.32 + rr() * 0.5) + 2.5; coj.push([px + rad * 0.6, y - rr() * h * 0.45, rad]); px += rad * (0.75 + rr() * 0.5); }
  c.fillStyle = osc; c.beginPath(); c.ellipse(x + w / 2, y + h * 0.28, w / 2 + 3, h * 0.42 + 2, 0, 0, 7); c.fill();
  for (const [cx, cy, rad] of coj) { c.beginPath(); c.ellipse(cx, cy + rad * 0.28, rad * 1.06, rad * 0.8, 0, 0, 7); c.fillStyle = osc; c.fill(); }
  for (const [cx, cy, rad] of coj) { c.beginPath(); c.ellipse(cx, cy, rad, rad * 0.72, 0, Math.PI, 0); c.lineTo(cx + rad, cy + rad * 0.4); c.lineTo(cx - rad, cy + rad * 0.4); c.closePath(); c.fillStyle = col; c.fill(); }
  c.strokeStyle = TINTA; c.lineWidth = 1.5;
  for (const [cx, cy, rad] of coj) { c.beginPath(); c.ellipse(cx, cy, rad, rad * 0.72, 0, Math.PI * 1.08, Math.PI * 1.92); c.stroke(); }
  for (const [cx, cy, rad] of coj) { c.fillStyle = rgba(cla, 0.75); c.beginPath(); c.ellipse(cx - rad * 0.25, cy - rad * 0.38, rad * 0.46, rad * 0.2, -0.2, 0, 7); c.fill(); }
  const n = Math.min(500, Math.floor((w * h) / 16));
  for (let k = 0; k < n; k++) {
    const q = coj[Math.floor(rr() * coj.length)], a = rr() * Math.PI, d = rr() * q[2] * 0.85;
    const hx = q[0] - Math.cos(a) * d, hy = q[1] - Math.sin(a) * d * 0.62 + q[2] * 0.1;
    c.strokeStyle = rr() < 0.55 ? rgba(cla, 0.9) : rgba(osc, 0.8); c.lineWidth = 1.1;
    c.beginPath(); c.moveTo(hx - 2, hy); c.lineTo(hx + 2, hy); c.moveTo(hx, hy - 2.2); c.lineTo(hx, hy + 1.4); c.stroke();
  }
  if (o.esporas !== false) for (let k = 0; k < w / 13; k++) {
    const q = coj[Math.floor(rr() * coj.length)], sx = q[0] + (rr() - 0.5) * q[2], sy = q[1] - q[2] * 0.55, l = 6 + rr() * 13, inc = (rr() - 0.5) * 7;
    c.strokeStyle = '#8a6a3c'; c.lineWidth = 1; c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo(sx + inc * 0.3, sy - l * 0.6, sx + inc, sy - l); c.stroke();
    c.fillStyle = '#4e381f'; c.beginPath(); c.ellipse(sx + inc, sy - l, 1.5, 2.6, inc * 0.06, 0, 7); c.fill();
  }
  if (o.cuelga) for (let k = 0; k < w / 8; k++) {
    const sx = x + rr() * w, l = 4 + rr() * o.cuelga, y0 = y + h * 0.3;
    c.strokeStyle = rgba(rr() < 0.5 ? col : osc, 0.95); c.lineWidth = 1.7; c.beginPath(); c.moveTo(sx, y0); c.quadraticCurveTo(sx + 2, y0 + l * 0.6, sx + (rr() - 0.5) * 4, y0 + l); c.stroke();
  }
}
// BARBA de musgo que cuelga de una rama: cinco hebras con flecos
function barba(x, y, l, col, sem) {
  const rr = azar(sem);
  for (let k = 0; k < 5; k++) {
    const sx = x + (rr() - 0.5) * 12, ll = l * (0.45 + rr() * 0.55), dv = (rr() - 0.5) * 14;
    c.strokeStyle = rgba(k % 2 ? col : mezclar(col, '#e6efb4', 0.28), 0.92); c.lineWidth = 2.4 - k * 0.3;
    c.beginPath(); c.moveTo(sx, y); c.bezierCurveTo(sx + dv, y + ll * 0.3, sx - dv, y + ll * 0.65, sx + dv * 0.5, y + ll); c.stroke();
    c.lineWidth = 1;
    for (let t = 0.15; t < 1; t += 0.1) { const hx = sx + dv * 0.3 * Math.sin(t * 6), hy = y + ll * t; c.beginPath(); c.moveTo(hx, hy); c.lineTo(hx + (rr() - 0.5) * 9, hy + 3 + rr() * 5); c.stroke(); }
  }
}
// HONGO DE REPISA pegado a un tronco (lado -1 izquierda, 1 derecha)
function repisa(ex, ey, fw, lado) {
  c.beginPath(); c.moveTo(ex, ey - 7); c.quadraticCurveTo(ex + lado * fw * 1.25, ey - 12, ex + lado * fw, ey + 2); c.quadraticCurveTo(ex + lado * fw * 0.5, ey + 6, ex, ey + 5); c.closePath();
  c.fillStyle = '#c9b98e'; c.fill(); tinta(c, 1.8);
  c.strokeStyle = 'rgba(80,60,30,.6)'; c.lineWidth = 1; for (let q = 1; q < 3; q++) { c.beginPath(); c.moveTo(ex, ey - 7 + q * 3); c.quadraticCurveTo(ex + lado * fw * (1.25 - q * 0.25), ey - 10 + q * 3, ex + lado * fw * (1 - q * 0.2), ey + 2); c.stroke(); }
  c.strokeStyle = 'rgba(60,45,25,.55)'; for (let q = 0; q < 6; q++) { const t = (q + 0.5) / 6; c.beginPath(); c.moveTo(ex + lado * fw * t * 0.9, ey + 1); c.lineTo(ex + lado * fw * t * 0.8, ey + 5); c.stroke(); }
}
// MATA DE HIERBA
function hierba(x, y, alto, col, sem) {
  const rr = azar(sem), n = 4 + Math.floor(rr() * 4);
  for (let k = 0; k < n; k++) { const a = (k / (n - 1) - 0.5) * 1.1 + (rr() - 0.5) * 0.3, l = alto * (0.6 + rr() * 0.5); c.strokeStyle = k % 3 ? col : mezclar(col, '#e6efb4', 0.3); c.lineWidth = 1.6; c.beginPath(); c.moveTo(x + (rr() - 0.5) * 4, y); c.quadraticCurveTo(x + Math.sin(a) * l * 0.4, y - l * 0.6, x + Math.sin(a) * l, y - Math.cos(a) * l); c.stroke(); }
}
// FLOR: margarita (petalos palidos) o campanilla morada colgando de un tallo
function flor(x, y, tipo, sem) {
  const rr = azar(sem), h = 10 + rr() * 16;
  c.strokeStyle = '#4f6a3c'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 3, y - h * 0.6, x + (rr() - 0.5) * 4, y - h); c.stroke();
  const fx = x, fy = y - h;
  if (tipo === 0) { for (let k = 0; k < 7; k++) { const a = (k / 7) * Math.PI * 2; c.fillStyle = '#f2ecdc'; c.beginPath(); c.ellipse(fx + Math.cos(a) * 3.4, fy + Math.sin(a) * 2.2, 2.6, 1.3, a, 0, 7); c.fill(); } c.fillStyle = '#d8c46a'; c.beginPath(); c.arc(fx, fy, 1.8, 0, 7); c.fill(); }
  else if (tipo === 1) { for (let k = 0; k < 3; k++) { c.fillStyle = '#9d8ab8'; c.beginPath(); c.ellipse(fx + 3 + k * 3, fy + 3 + k * 4, 2.3, 3.2, 0.3, 0, 7); c.fill(); c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 0.8; c.stroke(); } }
  else { c.fillStyle = '#e8e2f0'; for (let k = 0; k < 5; k++) { c.beginPath(); c.arc(fx + (rr() - 0.5) * 6, fy + (rr() - 0.5) * 5, 1.8, 0, 7); c.fill(); } }
}
function poli(pts, col, gr = 3, sem = 1, amp = 1.6) { const p = temblar(pts, 22, amp, sem); trazar(c, p); c.fillStyle = col; c.fill(); if (gr) tinta(c, gr); return p; }
function arbolGrande(x, alto, ancho, semilla, k = 1) {
  const rr = azar(semilla), base = sueloY(x);
  const col = mezclar('#3b4235', '#000000', 0.15 * k), luz = mezclar(col, '#cfd8a8', 0.18);
  const pts = [], curva = (rr() - 0.5) * 60;
  for (let j = 0; j <= 8; j++) { const t = j / 8; pts.push([x - ancho / 2 * (0.75 + 0.25 * t) + curva * Math.sin(t * 3) * (1 - t), base - alto * (1 - t)]); }
  pts.push([x - ancho * 0.95, base + 6], [x - ancho * 1.4, base + 12], [x + ancho * 1.4, base + 12], [x + ancho * 0.95, base + 6]);
  for (let j = 8; j >= 0; j--) { const t = j / 8; pts.push([x + ancho / 2 * (0.75 + 0.25 * t) + curva * Math.sin(t * 3) * (1 - t), base - alto * (1 - t)]); }
  const p = poli(pts, col, 3.2, semilla, 3);
  c.strokeStyle = rgba('#000000', 0.35); c.lineWidth = 2;
  for (let l = 0; l < ancho / 12; l++) { const lx = x - ancho * 0.4 + rr() * ancho * 0.8; c.beginPath(); c.moveTo(lx, base - alto); for (let y = base - alto; y < base; y += 40) c.lineTo(lx + (rr() - 0.5) * 8, y); c.stroke(); }
  const g = c.createLinearGradient(x - ancho / 2, 0, x + ancho / 2, 0); g.addColorStop(0, rgba(luz, 0.55)); g.addColorStop(0.4, rgba(luz, 0));
  c.save(); trazar(c, p); c.clip(); c.fillStyle = g; c.fillRect(x - ancho * 1.5, base - alto, ancho * 3, alto + 20);
  // corteza: grietas hondas con el canto de la placa iluminado, cortes de traves y liquen
  for (let l = 0; l < ancho / 6; l++) {
    const lx = x - ancho * 0.6 + rr() * ancho * 1.2; let yy = base + 12; const pts2 = [];
    while (yy > base - alto - 20) { yy -= 18 + rr() * 34; pts2.push([lx + (rr() - 0.5) * 8, yy]); }
    c.strokeStyle = rgba('#000000', 0.5); c.lineWidth = 1.5 + rr() * 3; c.beginPath(); c.moveTo(lx, base + 12); for (const [a, b] of pts2) c.lineTo(a, b); c.stroke();
    c.strokeStyle = rgba(luz, 0.28); c.lineWidth = 1.2; c.beginPath(); c.moveTo(lx + 3.5, base + 12); for (const [a, b] of pts2) c.lineTo(a + 3.5, b); c.stroke();
  }
  for (let k = 0; k < alto / 22; k++) { const cx = x - ancho * 0.5 + rr() * ancho, cy = base - rr() * alto; c.strokeStyle = rgba('#000000', 0.45); c.lineWidth = 1.4; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + 5 + rr() * 10, cy + (rr() - 0.5) * 3); c.stroke(); }
  for (let k = 0; k < 22; k++) { const cx = x - ancho * 0.45 + rr() * ancho * 0.9, cy = base - 40 - rr() * alto * 0.85; for (let q = 0; q < 5; q++) { c.fillStyle = rgba(q % 2 ? '#b9c7a3' : '#9fb08a', 0.5); c.beginPath(); c.arc(cx + (rr() - 0.5) * 12, cy + (rr() - 0.5) * 9, 1.5 + rr() * 4, 0, 7); c.fill(); } }
  // sombra que deja la copa al pie
  const gb = c.createLinearGradient(0, base - 160, 0, base + 10); gb.addColorStop(0, 'rgba(10,14,8,0)'); gb.addColorStop(1, 'rgba(10,14,8,.45)'); c.fillStyle = gb; c.fillRect(x - ancho * 1.5, base - 160, ancho * 3, 180);
  c.restore();
  // el borde del tronco a una altura (para pegarle cosas)
  const borde = (yy, ld) => { const t = 1 - (base - yy) / alto; return x + ld * ancho / 2 * (0.75 + 0.25 * t) + curva * Math.sin(t * 3) * (1 - t); };
  // nudos
  for (let k = 0; k < 2; k++) { const nx = x + (rr() - 0.5) * ancho * 0.45, ny = base - alto * (0.22 + rr() * 0.45); c.beginPath(); c.ellipse(nx, ny, 9 + rr() * 6, 15 + rr() * 8, 0, 0, 7); c.fillStyle = mezclar(col, '#000000', 0.35); c.fill(); tinta(c, 2); c.beginPath(); c.ellipse(nx, ny, 5, 9, 0, 0, 7); c.strokeStyle = rgba(luz, 0.45); c.lineWidth = 1.2; c.stroke(); c.fillStyle = '#0d0f0b'; c.beginPath(); c.ellipse(nx, ny + 2, 2.6, 4.6, 0, 0, 7); c.fill(); }

for (let k = 0; k < 200; k++) { const x = r() * 3500, y = 420 + r() * 600; brillo(x, y, 10 + r() * 10, '#e9f5c0', 0.45); c.fillStyle = 'rgba(250,255,220,.9)'; c.fillRect(x - 1, y - 1, 2.5, 2.5); }
c.restore();
const vg = c.createLinearGradient(0, 0, 0, HA); vg.addColorStop(0, 'rgba(0,0,0,.25)'); vg.addColorStop(0.3, 'rgba(0,0,0,0)'); vg.addColorStop(0.85, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
c.fillStyle = vg; c.fillRect(0, 0, W, HA);

// ---------------------------------------------------------------- rotulos
c.textBaseline = 'alphabetic';
function rotulo(x, y, titulo, texto, haciaX, haciaY) {
  c.strokeStyle = 'rgba(240,232,214,.85)'; c.lineWidth = 2;
  if (haciaX !== undefined) { c.beginPath(); c.moveTo(x + 10, y + 16); c.lineTo(haciaX, haciaY); c.stroke(); c.beginPath(); c.arc(haciaX, haciaY, 6, 0, 7); c.fillStyle = 'rgba(240,232,214,.95)'; c.fill(); }
  c.font = 'bold 26px Georgia'; const w1 = c.measureText(titulo).width; c.font = '20px Georgia'; const w = Math.max(w1, c.measureText(texto).width) + 36;
  c.fillStyle = 'rgba(11,10,12,.74)'; c.fillRect(x, y, w, 76); c.strokeStyle = 'rgba(240,232,214,.5)'; c.lineWidth = 1; c.strokeRect(x, y, w, 76);
  c.fillStyle = '#f0e8d6'; c.font = 'bold 26px Georgia'; c.fillText(titulo, x + 18, y + 32);
  c.fillStyle = 'rgba(240,232,214,.8)'; c.font = '20px Georgia'; c.fillText(texto, x + 18, y + 60);
}
ESC.forEach((e, k) => {
  const cx = (e.x0 + e.x1) / 2;
  c.fillStyle = 'rgba(11,10,12,.6)'; c.beginPath(); c.arc(cx - 0, 256, 26, 0, 7); c.fill(); c.strokeStyle = 'rgba(240,232,214,.7)'; c.lineWidth = 2; c.stroke();
  c.font = '30px Georgia'; const wt = Math.max(c.measureText(e.n.toUpperCase()).width, (c.font = 'italic 20px Georgia', c.measureText(e.d).width)) + 50;
  c.fillStyle = 'rgba(11,10,12,.62)'; c.fillRect(cx - wt / 2, 290, wt, 74);
  c.fillStyle = '#f0e8d6'; c.font = 'bold 26px Georgia'; c.textAlign = 'center'; c.fillText(String(k + 1), cx, 265);
  c.font = '30px Georgia'; c.fillText(e.n.toUpperCase(), cx, 320);
  c.fillStyle = 'rgba(240,232,214,.75)'; c.font = 'italic 20px Georgia'; c.fillText(e.d, cx, 350);
  c.textAlign = 'left';
  if (k) { c.strokeStyle = 'rgba(240,232,214,.25)'; c.setLineDash([6, 10]); c.beginPath(); c.moveTo(e.x0, 220); c.lineTo(e.x0, 380); c.stroke(); c.setLineDash([]); }
});
rotulo(1560, 560, 'Juego 1 · Los anillos del árbol', 'Girar los anillos tallados hasta casar las marcas: la raíz se aparta', 1760, sueloY(1760) - 90);

rotulo(140, 760, 'Sale del laboratorio', 'Por el conducto, a la ladera', 330, sueloY(330) - 60);
rotulo(2500, 760, 'Cruzar el arroyo', 'Por el tronco caído o saltando las piedras', 2700, AGUA - 20);
rotulo(3380, 620, 'Subir por el tejado', 'De la cabaña a las ramas', 3525, sueloY(3525) - 230);
rotulo(5480, 560, 'Por los tejados de la aldea', 'Farolillos y molino de fondo', 5635, sueloY(5635) - 230);
rotulo(6380, 700, 'Los postes y los coches', 'La hiedra se va acabando', 6930, sueloY(6930) - 90);
c.fillStyle = 'rgba(11,10,12,.8)'; c.fillRect(40, 40, 1500, 140); c.strokeStyle = 'rgba(240,232,214,.5)'; c.strokeRect(40, 40, 1500, 140);
c.fillStyle = '#f0e8d6'; c.font = '50px Georgia'; c.fillText('Nivel 5 · El Linde   —   mapa de concepto', 70, 104);
c.fillStyle = 'rgba(240,232,214,.78)'; c.font = '23px Georgia'; c.fillText('Al salir del laboratorio. Ocho escenarios que cambian poco a poco, del bosque de musgo a la ciudad muerta, en un solo nivel corto (unos 5 min).', 70, 150);

// ---------------------------------------------------------------- el esquema del recorrido (debajo)
c.fillStyle = '#121214'; c.fillRect(0, HA, W, H - HA);
const ey = HA + 110;
c.strokeStyle = 'rgba(240,232,214,.35)'; c.lineWidth = 4; c.beginPath(); c.moveTo(80, ey); c.lineTo(W - 80, ey); c.stroke();
ESC.forEach((e, k) => {
  const x0 = 80 + (e.x0 / W) * (W - 160), x1 = 80 + (e.x1 / W) * (W - 160);
  c.fillStyle = porEsc((e.x0 + e.x1) / 2, (q) => q.cielo[1]); c.fillRect(x0 + 4, ey - 16, x1 - x0 - 8, 32);
  c.fillStyle = '#f0e8d6'; c.font = '22px Georgia'; c.textAlign = 'center'; c.fillText(`${k + 1} · ${e.n}`, (x0 + x1) / 2, ey + 60);
  c.textAlign = 'left';
});
for (const [x, t] of [[1760, 'Juego 1'], [4995, 'Juego 2'], [7960, 'Juego 3']]) {
  const sx = 80 + (x / W) * (W - 160);
  c.fillStyle = '#a9cde6'; c.beginPath(); c.moveTo(sx, ey - 34); c.lineTo(sx + 14, ey - 20); c.lineTo(sx, ey - 6); c.lineTo(sx - 14, ey - 20); c.fill();
  c.fillStyle = '#a9cde6'; c.font = 'bold 22px Georgia'; c.textAlign = 'center'; c.fillText(t, sx, ey - 46); c.textAlign = 'left';
}
c.fillStyle = 'rgba(240,232,214,.6)'; c.font = 'italic 20px Georgia'; c.fillText('Del laboratorio (nivel 4) a Boundland (nivel 6): se entra por el conducto y se sale andando a la calle, sin corte.', 80, H - 26);
